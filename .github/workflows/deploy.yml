name: Deploy React to Shared Hosting Repo

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22
  REMOTE_PATH: /home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react
  SSH_OPTS: -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }}

jobs:
  deploy:
    environment: Production CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install & build
        run: |
          npm ci
          printf "VITE_BASE_NAME=/\nVITE_API_URL=${{ vars.VITE_API_URL }}\n" > .env
          npm run build

      - name: Verify & zip build
        run: |
          echo "--- Build output ---"
          du -sh dist
          find dist -type f | wc -l
          zip -rq dist.zip dist/
          ls -lah dist.zip

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_PATH }}/
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "find ${{ env.REMOTE_PATH }} -mindepth 1 -delete"

          scp ${{ env.SSH_OPTS }} dist.zip \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_PATH }}/

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ env.REMOTE_PATH }} && unzip -oq dist.zip && mv dist/* . && rm -rf dist dist.zip"

      - name: Verify upload
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ls -lah ${{ env.REMOTE_PATH }}"

      - name: Commit frontend build
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd /home/${{ secrets.SSH_USER }}/repositories/compro-asputra
          git add public_html/react
          if ! git diff --cached --quiet; then
            git commit -m "deploy: frontend build ${{ github.sha }}"
            git push origin main
          else
            echo "No changes to commit, skipping."
          fi
          EOF