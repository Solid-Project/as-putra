name: Deploy React to Shared Hosting Repo

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22

jobs:
  deploy:
    environment: Production CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record start time
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install & build
        run: |
          npm ci
          printf "VITE_BASE_NAME=/\nVITE_API_URL=${{ vars.VITE_API_URL }}\n" > .env
          npm run build

      - name: Verify & zip build
        run: |
          echo "--- Build output ---"
          du -sh dist
          find dist -type f | wc -l
          zip -rq dist.zip dist/
          ls -lah dist.zip

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          REMOTE_PATH="/home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react"
          SSH="ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }}"

          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "find $REMOTE_PATH -mindepth 1 -delete"

          scp -i ~/.ssh/id_rsa -P ${{ secrets.SSH_PORT }} dist.zip \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_PATH/

          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd $REMOTE_PATH && unzip -oq dist.zip && mv dist/* . && rm -rf dist dist.zip"

      - name: Verify upload
        run: |
          REMOTE_PATH="/home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react"
          SSH="ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }}"

          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ls -lah $REMOTE_PATH"

      - name: Commit frontend build
        run: |
          REPO_PATH="/home/${{ secrets.SSH_USER }}/repositories/compro-asputra"
          SSH="ssh -i ~/.ssh/id_rsa -p ${{ secrets.SSH_PORT }}"

          $SSH ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd /home/${{ secrets.SSH_USER }}/repositories/compro-asputra
          git add public_html/react
          if ! git diff --cached --quiet; then
            git commit -m "Deploy: Automated frontend build ${{ github.sha }}"
            git push origin main
          else
            echo "No changes to commit, skipping."
          fi
          EOF
      
      - name: Notify Discord - SUCCESS
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))
          if [ $DURATION -ge 60 ]; then
            DURATION_FMT="$((DURATION / 60))m $((DURATION % 60))s"
          else
            DURATION_FMT="${DURATION}s"
          fi
 
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_MSG="${COMMIT_MSG//$'\n'/ }"
          COMMIT_MSG="${COMMIT_MSG//$'\r'/ }"
          SHORT_SHA="${GITHUB_SHA::7}"
          JOB_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          COMMIT_URL="https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          AVATAR_URL="https://avatars.githubusercontent.com/$GITHUB_ACTOR"
 
          curl -s -H "Content-Type: application/json" -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 Deployment Successful\",
              \"url\": \"$JOB_URL\",
              \"description\": \"> 💬 $COMMIT_MSG\",
              \"color\": 3066993,
              \"thumbnail\": { \"url\": \"$AVATAR_URL\" },
              \"fields\": [
                {
                  \"name\": \"📊 Status  ·  ⏱ Duration  ·  🔢 Run\",
                  \"value\": \"\`✅ SUCCESS\`  \`$DURATION_FMT\`  [#$GITHUB_RUN_NUMBER]($JOB_URL)\",
                  \"inline\": false
                },
                {
                  \"name\": \"🌿 Branch  ·  👤 Triggered by  ·  🔗 Commit\",
                  \"value\": \"\`$GITHUB_REF_NAME\`  $GITHUB_ACTOR  [\`$SHORT_SHA\`]($COMMIT_URL)\",
                  \"inline\": false
                }
              ],
              \"footer\": {
                \"text\": \"CI/CD Pipeline · compro-asputra · Node ${{ env.NODE_VERSION }} · ubuntu-latest\",
                \"icon_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}
 
      - name: Notify Discord - FAILED
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))
          if [ $DURATION -ge 60 ]; then
            DURATION_FMT="$((DURATION / 60))m $((DURATION % 60))s"
          else
            DURATION_FMT="${DURATION}s"
          fi
 
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_MSG="${COMMIT_MSG//$'\n'/ }"
          COMMIT_MSG="${COMMIT_MSG//$'\r'/ }"
          SHORT_SHA="${GITHUB_SHA::7}"
          JOB_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          COMMIT_URL="https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          AVATAR_URL="https://avatars.githubusercontent.com/$GITHUB_ACTOR"
 
          curl -s -H "Content-Type: application/json" -X POST \
          -d "{
            \"content\": \"@here ‼️ **DEPLOYMENT GAGAL**\",
            \"embeds\": [{
              \"title\": \"🔴 Deployment Failed\",
              \"url\": \"$JOB_URL\",
              \"description\": \"> 💬 $COMMIT_MSG\",
              \"color\": 15158332,
              \"thumbnail\": { \"url\": \"$AVATAR_URL\" },
              \"fields\": [
                {
                  \"name\": \"📊 Status  ·  ⏱ Failed After  ·  🔢 Run\",
                  \"value\": \"\`❌ FAILED\`  \`$DURATION_FMT\`  [#$GITHUB_RUN_NUMBER]($JOB_URL)\",
                  \"inline\": false
                },
                {
                  \"name\": \"🌿 Branch  ·  👤 Triggered by  ·  🔗 Commit\",
                  \"value\": \"\`$GITHUB_REF_NAME\`  $GITHUB_ACTOR  [\`$SHORT_SHA\`]($COMMIT_URL)\",
                  \"inline\": false
                }
              ],
              \"footer\": {
                \"text\": \"CI/CD Pipeline · compro-asputra · Node ${{ env.NODE_VERSION }} · ubuntu-latest\",
                \"icon_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}