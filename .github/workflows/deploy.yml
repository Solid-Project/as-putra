name: Deploy React to Shared Hosting Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: Production CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: |
          echo "VITE_BASE_NAME=/" > .env
          npm run build

      - name: Verify Build Output
        run: |
          echo "===== DIST INFO ====="
          ls -lah dist
          du -sh dist
          find dist -type f | wc -l

      - name: Zip Build
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          ls -lah dist.zip

      - name: Clean Target Directory
        run: |
          ssh -i "${{ secrets.SSH_PRIVATE_KEY }}" -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "find /home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react -mindepth 1 -delete"

      - name: Upload ZIP to Server
        run: |
          scp -i "${{ secrets.SSH_PRIVATE_KEY }}" -P ${{ secrets.SSH_PORT }} \
          dist.zip \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react/

      - name: Extract Build
        run: |
          ssh -i "${{ secrets.SSH_PRIVATE_KEY }}" -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react
            unzip -o dist.zip
            rm -f dist.zip
          EOF

      - name: Verify Upload on Server
        run: |
          ssh -i "${{ secrets.SSH_PRIVATE_KEY }}" -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "ls -lah /home/${{ secrets.SSH_USER }}/repositories/compro-asputra/public_html/react"

      - name: Commit Frontend Build
        run: |
          ssh -i "${{ secrets.SSH_PRIVATE_KEY }}" -p ${{ secrets.SSH_PORT }} \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e
            cd /home/${{ secrets.SSH_USER }}/repositories/compro-asputra

            git add public_html/react

            if ! git diff --cached --quiet; then
              git commit -m "🚀 Automated Frontend Deploy ${{ github.sha }}"
              git push origin main
              echo "Deploy committed & pushed successfully"
            else
              echo "No changes detected"
            fi

          EOF