name: Deploy React to Shared Hosting Repo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: Production CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Node Version
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: |
          echo "VITE_BASE_NAME=/" > .env
          npm run build

      - name: Debug Workspace
        run: |
          echo "========== CURRENT DIR =========="
          pwd

          echo "========== ROOT FILES =========="
          ls -lah

          echo "========== DIST EXISTS =========="
          if [ -d "dist" ]; then
            echo "dist folder found"
          else
            echo "dist folder NOT found"
            exit 1
          fi

          echo "========== DIST CONTENT =========="
          ls -lah dist

          echo "========== DIST SIZE =========="
          du -sh dist

          echo "========== TOTAL FILES =========="
          find dist -type f | wc -l

      - name: Create Test File
        run: |
          echo "HELLO FROM GITHUB ACTIONS" > test.txt
          ls -lah test.txt

      - name: Upload Test File
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "test.txt"
          target: "/home/${{ secrets.SSH_USER }}/"

      - name: Verify File On Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "========== HOME DIR =========="
            pwd

            echo "========== TEST FILE =========="
            ls -lah /home/${{ secrets.SSH_USER }}/test.txt

            echo "========== CONTENT =========="
            cat /home/${{ secrets.SSH_USER }}/test.txt